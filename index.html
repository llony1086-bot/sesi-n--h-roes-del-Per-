<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Interactiva Premium - Héroes del Perú</title>
    <style>
        :root {
            --rojo-peru: #C8102E;
            --rojo-oscuro: #8B0000;
            --dorado: #D4AF37;
            --azul-marino: #1E293B;
            --gris-claro: #F8FAFC;
            --borde: #E2E8F0;
            --texto: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--texto);
            line-height: 1.6;
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Cabecera Premium */
        header {
            background: linear-gradient(135deg, var(--rojo-peru) 0%, var(--rojo-oscuro) 100%);
            color: white;
            padding: 35px 25px;
            text-align: center;
            border-bottom: 5px solid var(--dorado);
        }

        .institucion {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 5px 0;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 1.05rem;
            opacity: 0.95;
        }

        /* Barra de herramientas rápida */
        .toolbar {
            background: var(--gris-claro);
            padding: 12px 25px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar span {
            font-size: 0.9rem;
            color: #64748B;
            font-weight: 500;
        }

        .toolbar-btns button {
            background: white;
            border: 1px solid #CBD5E1;
            color: var(--azul-marino);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar-btns button:hover {
            background: var(--azul-marino);
            color: white;
            border-color: var(--azul-marino);
        }

        .content-body {
            padding: 25px;
        }

        /* Ventanas Principales (Acordeones) */
        .ventana-item {
            margin-bottom: 16px;
            border: 1px solid var(--borde);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .ventana-btn {
            background: white;
            color: var(--azul-marino);
            cursor: pointer;
            padding: 18px 22px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .ventana-btn:hover {
            background: #FFF5F5;
            color: var(--rojo-peru);
        }

        .ventana-btn.activo {
            background: var(--rojo-peru);
            color: white;
        }

        .ventana-btn .icono-flecha {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            background: rgba(0,0,0,0.06);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .ventana-btn.activo .icono-flecha {
            transform: rotate(180deg);
            background: rgba(255,255,255,0.2);
        }

        .ventana-contenido {
            display: none;
            padding: 22px;
            background: white;
            border-top: 1px solid var(--borde);
        }

        .ventana-contenido.abierto {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tablas elegantes */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--borde);
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #FEF2F2;
            color: var(--rojo-oscuro);
            font-weight: 700;
        }

        /* Sub-ventanas de Procesos Pedagógicos */
        .sub-ventana-item {
            margin-top: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            overflow: hidden;
        }

        .sub-ventana-btn {
            background: var(--azul-marino);
            color: white;
            cursor: pointer;
            padding: 14px 18px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .sub-ventana-btn:hover {
            background: #0F172A;
        }

        .sub-ventana-btn.activo {
            background: #334155;
        }

        /* Sección Interactiva de Héroes */
        .heroes-instruccion {
            background: #FFFBEB;
            border-left: 4px solid var(--dorado);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
            color: #92400E;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .heroe-btn {
            padding: 14px 16px;
            background: var(--gris-claro);
            border: 2px solid #CBD5E1;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--azul-marino);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .heroe-btn:hover {
            border-color: var(--rojo-peru);
            color: var(--rojo-peru);
            transform: translateY(-2px);
        }

        .heroe-btn.seleccionado {
            background: var(--rojo-peru);
            color: white;
            border-color: var(--rojo-peru);
            box-shadow: 0 4px 12px rgba(200, 16, 46, 0.3);
        }

        .heroe-card {
            display: none;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border: 2px solid var(--rojo-peru);
            border-radius: 12px;
            padding: 22px;
            gap: 24px;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .heroe-card.visible {
            display: flex;
            flex-wrap: wrap;
            animation: slideDown 0.35s ease;
        }

        .heroe-card img {
            width: 170px;
            height: 215px;
            object-fit: cover;
            border-radius: 10px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #e2e8f0;
        }

        .heroe-info {
            flex: 1;
            min-width: 260px;
        }

        .badge-etapa {
            display: inline-block;
            background: var(--rojo-peru);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .heroe-info h3 {
            margin: 0 0 10px 0;
            color: var(--azul-marino);
            font-size: 1.4rem;
        }

        .cita-historica {
            margin-top: 12px;
            padding: 10px 14px;
            background: #FEF2F2;
            border-left: 3px solid var(--rojo-peru);
            font-style: italic;
            color: #7F1D1D;
            border-radius: 0 6px 6px 0;
        }

        footer {
            text-align: center;
            padding: 18px;
            background: var(--gris-claro);
            border-top: 1px solid var(--borde);
            font-size: 0.85rem;
            color: #64748B;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="institucion">I.E. N° 0759 "FRANCISCO BOLOGNESI" • CIENCIAS SOCIALES</div>
        <h1>HÉROES DEL PERÚ (SIGLO XIX)</h1>
        <p>Sesión Interactiva: Contexto histórico y legado de José Olaya, Pedro Ruiz Gallo y Andrés Avelino Cáceres</p>
    </header>

    <div class="toolbar">
        <span>💡 Haz clic en cada sección para desplegar su contenido</span>
        <div class="toolbar-btns">
            <button type="button" onclick="abrirTodo()">Abrir todo</button>
