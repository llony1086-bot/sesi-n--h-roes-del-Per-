<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Interactiva Premium - Héroes del Perú (Siglo XIX)</title>
    <style>
        :root {
            --rojo-peru: #D91023;
            --rojo-oscuro: #990B18;
            --azul-marino: #1E3A8A;
            --azul-oscuro: #0F172A;
            --dorado: #D97706;
            --gris-fondo: #F1F5F9;
            --gris-claro: #F8FAFC;
            --borde: #CBD5E1;
            --texto: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--gris-fondo);
            color: var(--texto);
            line-height: 1.65;
            padding: 16px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
            overflow: hidden;
            border: 1px solid var(--borde);
        }

        header {
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-marino) 100%);
            color: white;
            padding: 36px 24px;
            text-align: center;
            border-bottom: 6px solid var(--rojo-peru);
        }

        .badge-ie {
            display: inline-block;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            margin-bottom: 14px;
        }

        header h1 {
            font-size: 2.1rem;
            margin-bottom: 10px;
            letter-spacing: 0.8px;
        }

        header p {
            color: #E2E8F0;
            font-size: 1.05rem;
            max-width: 720px;
            margin: 0 auto 18px auto;
        }

        .proposito-box {
            background: rgba(15, 23, 42, 0.55);
            border-left: 4px solid #FBBF24;
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 760px;
            margin: 0 auto;
            text-align: left;
            font-size: 0.92rem;
            color: #F8FAFC;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 24px;
            background: var(--gris-claro);
            border-bottom: 1px solid var(--borde);
        }

        .toolbar-info {
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
        }

        .toolbar-btns {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-abrir {
            background-color: var(--azul-marino);
            color: white;
        }

        .btn-abrir:hover {
            background-color: var(--azul-oscuro);
        }

        .btn-cerrar {
            background-color: #E2E8F0;
            color: #1E293B;
        }

        .btn-cerrar:hover {
            background-color: #CBD5E1;
        }

        main {
            padding: 24px;
        }

        details.bloque {
            border: 1px solid var(--borde);
            border-radius: 12px;
            margin-bottom: 18px;
            background: #FFFFFF;
            overflow: hidden;
        }

        details.bloque summary {
            list-style: none;
            cursor: pointer;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--azul-marino);
            background: #FFFFFF;
            user-select: none;
        }

        details.bloque summary::-webkit-details-marker {
            display: none;
        }

        details.bloque[open] summary {
            background: #F8FAFC;
            border-bottom: 1px solid var(--borde);
        }

        .flecha {
            font-size: 1.1rem;
            color: var(--rojo-peru);
            transition: transform 0.25s ease;
        }

        details.bloque[open] .flecha {
            transform: rotate(180deg);
        }

        .contenido {
            padding: 22px;
        }

        .timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }

        .hito {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-top: 4px solid var(--azul-marino);
            padding: 14px;
            border-radius: 8px;
        }

        .hito.rojo {
            border-top-color: var(--rojo-peru);
        }

        .hito strong {
            display: block;
            color: var(--azul-oscuro);
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .perfil-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 640px) {
            .perfil-grid {
                grid-template-columns: 1fr;
            }
            .retrato-box {
                max-width: 140px;
                margin: 0 auto;
            }
        }

        .retrato-box {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .retrato-box span {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #475569;
            margin-top: 6px;
        }

        .etiqueta {
            display: inline-block;
            background: #EFF6FF;
            color: var(--azul-marino);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #BFDBFE;
        }

        .heroe-datos h3 {
            color: var(--azul-oscuro);
            font-size: 1.35rem;
            margin-bottom: 10px;
        }

        .heroe-datos p {
            margin-bottom: 10px;
        }

        .cita-historica {
            margin-top: 14px;
            padding: 12px 16px;
            background: #FEF2F2;
            border-left: 4px solid var(--rojo-peru);
            font-style: italic;
            color: #7F1D1D;
            border-radius: 0 8px 8px 0;
            font-weight: 600;
        }

        .tabla-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--borde);
            padding: 12px;
            text-align: left;
        }

        th {
            background: var(--azul-marino);
            color: white;
        }

        tr:nth-child(even) {
            background: #F8FAFC;
        }

        .pregunta-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .pregunta-card p {
            font-weight: 700;
            color: var(--azul-oscuro);
            margin: 14px 0 8px 0;
        }

        .opcion-label {
            display: block;
            background: white;
            border: 1px solid #CBD5E1;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .opcion-label:hover {
            background: #EFF6FF;
            border-color: var(--azul-marino);
        }

        .btn-rojo {
            background: var(--rojo-peru);
            color: white;
            font-size: 1rem;
            padding: 12px 24px;
            margin-top: 10px;
        }

        .btn-rojo:hover {
            background: var(--rojo-oscuro);
        }

        .alerta-resultado {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 8px;
            font-weight: 700;
            display: none;
        }

        .input-grupo {
            margin-bottom: 14px;
        }

        .input-grupo label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--azul-oscuro);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .ficha-generada {
            margin-top: 16px;
            padding: 16px;
            background: #F0FDF4;
            border: 1px solid #86EFAC;
            border-radius: 10px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--gris-claro);
            border-top: 1px solid var(--borde);
            font-size: 0.88rem;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="badge-ie">I.E. N° 0759 "FRANCISCO BOLOGNESI" • CIENCIAS SOCIALES</div>
